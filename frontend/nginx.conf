server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # /api/* 요청은 Spring Boot 백엔드로 프록시
    # K8s 내부 Service 이름(${BACKEND_HOST})으로 연결
    location /api/ {
        proxy_pass         http://${BACKEND_HOST}:8080/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;

        # SSE(Server-Sent Events) 스트리밍을 위한 버퍼 비활성화
        proxy_buffering    off;
        proxy_cache        off;
    }

    # Vue SPA — 모든 경로를 index.html 로 fallback (클라이언트 라우팅)
    location / {
        try_files $uri $uri/ /index.html;
    }
}