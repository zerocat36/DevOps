# ── Frontend Deployment ───────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sk014-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sk014-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: sk014-frontend
    spec:
      imagePullSecrets:
        - name: harbor-pull-secret
      containers:
        - name: sk014-frontend
          image: HARBOR_REGISTRY/sk014/frontend:latest
          env:
            - name: BACKEND_HOST
              value: "sk014-backend-svc"
          ports:
            - containerPort: 80
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits:   { cpu: 200m, memory: 128Mi }
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 5
            periodSeconds: 5