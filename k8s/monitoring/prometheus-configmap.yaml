# ── Prometheus scrape 설정 ─────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: sk014-prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    scrape_configs:
      - job_name: sk014-backend
        metrics_path: /metrics
        static_configs:
          - targets: ['sk014-backend-svc:8080']
            labels:
              service: backend
