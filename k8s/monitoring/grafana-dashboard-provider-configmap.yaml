apiVersion: v1
kind: ConfigMap
metadata:
  name: sk014-grafana-dashboard-provider
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: sk014
        orgId: 1
        folder: SK014
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/sk014
