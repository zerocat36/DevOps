# ── Redis Leader (StatefulSet) ────────────────────────────────────
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sk014-redis-leader
spec:
  serviceName: sk014-redis-leader-svc
  replicas: 1
  selector:
    matchLabels:
      app: sk014-redis-leader
  template:
    metadata:
      labels:
        app: sk014-redis-leader
    spec:
      containers:
        - name: sk014-redis
          image: redis:7.2-alpine
          ports:
            - containerPort: 6379
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 200m, memory: 256Mi }