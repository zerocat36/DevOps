# ── Redis Follower ────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sk014-redis-follower
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sk014-redis-follower
  template:
    metadata:
      labels:
        app: sk014-redis-follower
    spec:
      containers:
        - name: sk014-redis
          image: redis:7.2-alpine
          command: ["redis-server", "--replicaof", "sk014-redis-leader-svc", "6379"]
          ports:
            - containerPort: 6379
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 200m, memory: 256Mi }