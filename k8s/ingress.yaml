# ── Ingress ───────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sk014-ingress
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
spec:
  ingressClassName: public-nginx
  rules:
    - host: sk014.project.skala-ai.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: sk014-backend-svc
                port: { number: 8080 }
          - path: /metrics
            pathType: Prefix
            backend:
              service:
                name: sk014-backend-svc
                port: { number: 8080 }
          - path: /grafana
            pathType: Prefix
            backend:
              service:
                name: sk014-grafana-svc
                port: { number: 3000 }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sk014-frontend-svc
                port: { number: 80 }