# ── Ingress ───────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sk014-ingress
spec:
  ingressClassName: public-nginx
  rules:
    - host: ingress.skala26a-sk014.project.skala-ai.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: sk014-backend-svc
                port: { number: 8080 }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sk014-frontend-svc
                port: { number: 80 }