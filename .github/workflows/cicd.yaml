name: CI/CD — Harbor push & EKS deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  HARBOR_HOST:     ${{ secrets.HARBOR_HOST }}
  HARBOR_REGISTRY: ${{ secrets.HARBOR_REGISTRY }}
  HARBOR_PROJECT:  ${{ secrets.HARBOR_PROJECT }}
  HARBOR_USER:     ${{ secrets.HARBOR_USER }}
  HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
  AWS_REGION:      ${{ secrets.AWS_REGION }}
  EKS_CLUSTER:     ${{ secrets.EKS_CLUSTER_NAME }}
  EKS_ACCESS_KEY:  ${{ secrets.EKS_ACCESS_KEY }}
  EKS_SECRET_KEY:  ${{ secrets.EKS_SECRET_KEY }}
  K8S_NAMESPACE:   ${{ secrets.K8S_NAMESPACE }}

jobs:
  # ── JOB 1: 빌드 & Harbor 푸시 ─────────────────────────────────
  build-and-push:
    name: Build & push to Harbor
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.tag.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Set image tag (git short SHA)
        id: tag
        run: echo "tag=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - uses: actions/setup-java@v4
        with: { java-version: '21', distribution: 'temurin', cache: gradle }

      - uses: actions/setup-node@v4
        with: { node-version: '24.14.0', cache: 'npm', cache-dependency-path: frontend/package-lock.json }

      - name: Build Vue
        working-directory: frontend
        run: npm ci && npm run build

      - name: Build Spring Boot
        working-directory: backend
        run: ./gradlew bootJar --no-daemon -x test

      - name: Log in to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.HARBOR_HOST }}
          username: ${{ env.HARBOR_USER }}
          password: ${{ env.HARBOR_PASSWORD }}

      - uses: docker/setup-buildx-action@v3

      # with: tags 대신 run: 에서 직접 docker buildx build 실행
      # → env 변수가 shell에서 정상 치환됨
      - name: Build & push frontend
        run: |
          docker buildx build \
            --push \
            --tag ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/frontend:${{ steps.tag.outputs.tag }} \
            --tag ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/frontend:latest \
            frontend

      - name: Build & push backend
        run: |
          docker buildx build \
            --push \
            --tag ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/backend:${{ steps.tag.outputs.tag }} \
            --tag ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/backend:latest \
            backend

  # ── JOB 2: EKS 배포 ───────────────────────────────────────────
  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ env.EKS_ACCESS_KEY }}
          aws-secret-access-key: ${{ env.EKS_SECRET_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name ${{ env.EKS_CLUSTER }} \
            --region ${{ env.AWS_REGION }}

      - name:  Harbor pull secret
        run: |
          kubectl create secret docker-registry harbor-pull-secret \
            --docker-server=${{ env.HARBOR_REGISTRY }} \
            --docker-username=${{ env.HARBOR_USER }} \
            --docker-password=${{ env.HARBOR_PASSWORD }} \
            --namespace ${{ env.K8S_NAMESPACE }} \
            --dry-run=client -o yaml | kubectl apply -f -

      # Repo → Settings → Secrets: GRAFANA_ADMIN_USER, GRAFANA_ADMIN_PASSWORD
      - name: Grafana admin secret
        env:
          GRAFANA_ADMIN_USER:     ${{ secrets.GRAFANA_ADMIN_USER }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${GRAFANA_ADMIN_USER}" ] || [ -z "${GRAFANA_ADMIN_PASSWORD}" ]; then
            echo "::error::Set repository secrets GRAFANA_ADMIN_USER and GRAFANA_ADMIN_PASSWORD."
            exit 1
          fi
          kubectl create secret generic sk014-grafana-secret \
            --from-literal=admin-user="${GRAFANA_ADMIN_USER}" \
            --from-literal=admin-password="${GRAFANA_ADMIN_PASSWORD}" \
            --namespace ${{ env.K8S_NAMESPACE }} \
            --dry-run=client -o yaml | kubectl apply -f -

      # 파일마다 따로 apply: 여러 YAML을 파이프로 이어 붙이면 --- 구분 없이 한 스트림이 되어
      # Ingress 등 뒤쪽 리소스가 무시되거나 적용이 불안정해질 수 있음
      - name: Apply K8s manifests
        run: |
          set -euo pipefail
          find k8s -name '*.yaml' -type f | sort | while IFS= read -r file; do
            echo "Applying $file"
            sed -e "s|HARBOR_REGISTRY|${{ env.HARBOR_REGISTRY }}|g" "$file" \
              | kubectl apply -f - --namespace ${{ env.K8S_NAMESPACE }}
          done

      - name: Restart Grafana (apply rotated admin password)
        run: |
          kubectl rollout restart deployment/sk014-grafana \
            --namespace ${{ env.K8S_NAMESPACE }} 2>/dev/null || true

      - name: Restart Prometheus (reload scrape config)
        run: |
          kubectl rollout restart deployment/sk014-prometheus \
            --namespace ${{ env.K8S_NAMESPACE }} 2>/dev/null || true

      - name: Update image tags
        run: |
          TAG=${{ needs.build-and-push.outputs.image-tag }}

          kubectl set image deployment/sk014-frontend \
            sk014-frontend=${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/frontend:${TAG} \
            --namespace ${{ env.K8S_NAMESPACE }}

          kubectl set image deployment/sk014-backend \
            sk014-backend=${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/backend:${TAG} \
            --namespace ${{ env.K8S_NAMESPACE }}

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/sk014-frontend \
            --namespace ${{ env.K8S_NAMESPACE }} --timeout=300s
          kubectl rollout status deployment/sk014-backend \
            --namespace ${{ env.K8S_NAMESPACE }} --timeout=300s

      - name: Smoke test
        run: |
          INGRESS=$(kubectl get ingress sk014-ingress \
            --namespace ${{ env.K8S_NAMESPACE }} \
            -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')

          echo "Endpoint: $INGRESS"

          for i in $(seq 1 10); do
            if curl -sf --max-time 5 "http://${INGRESS}/actuator/health" \
               | grep -q '"status":"UP"'; then
              echo "Health check passed"; break
            fi
            sleep 3
          done

      - name: Summary
        if: always()
        run: |
          echo "## Deploy Result" >> $GITHUB_STEP_SUMMARY
          echo "| 항목 | 값 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | \`${{ needs.build-and-push.outputs.image-tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Cluster | \`${{ env.EKS_CLUSTER }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Namespace | \`${{ env.K8S_NAMESPACE }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          kubectl get pods --namespace ${{ env.K8S_NAMESPACE }} >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY