name: CD — Harbor push & EKS deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  HARBOR_HOST:     ${{ secrets.HARBOR_HOST }}      # docker login용 도메인 (harbor.example.com)
  HARBOR_REGISTRY: ${{ secrets.HARBOR_REGISTRY }}  # 이미지 주소용 (harbor.example.com/sample)
  HARBOR_PROJECT:  ${{ secrets.HARBOR_PROJECT }}   # 프로젝트 이름 (dino-run)
  HARBOR_USER:     ${{ secrets.HARBOR_USER }}
  HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
  AWS_REGION:      ${{ secrets.AWS_REGION }}
  EKS_CLUSTER:     ${{ secrets.EKS_CLUSTER_NAME }}
  EKS_ACCESS_KEY:  ${{ secrets.EKS_ACCESS_KEY }}
  EKS_SECRET_KEY:  ${{ secrets.EKS_SECRET_KEY }}
  K8S_NAMESPACE:   ${{ secrets.K8S_NAMESPACE }}

jobs:
  # ── JOB 1: 빌드 & Harbor 푸시 ─────────────────────────────────
  build-and-push:
    name: Build & push to Harbor
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.tag.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Set image tag (git short SHA)
        id: tag
        run: echo "tag=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - uses: actions/setup-java@v4
        with: { java-version: '21', distribution: 'temurin', cache: gradle }

      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm', cache-dependency-path: frontend/package-lock.json }

      - name: Build Vue
        working-directory: frontend
        run: npm ci && npm run build

      - name: Build Spring Boot
        working-directory: backend
        run: ./gradlew bootJar --no-daemon -x test

      - name: Log in to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.HARBOR_HOST }}
          username: ${{ env.HARBOR_USER }}
          password: ${{ env.HARBOR_PASSWORD }}

      - uses: docker/setup-buildx-action@v3

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: frontend
          push: true
          tags: |
            ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/frontend:${{ steps.tag.outputs.tag }}
            ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/frontend:latest
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: backend
          push: true
          tags: |
            ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/backend:${{ steps.tag.outputs.tag }}
            ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/backend:latest
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  # ── JOB 2: EKS 배포 ───────────────────────────────────────────
  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ env.EKS_ACCESS_KEY }}
          aws-secret-access-key: ${{ env.EKS_SECRET_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name ${{ env.EKS_CLUSTER }} \
            --region ${{ env.AWS_REGION }}

      - name: Create namespace & Harbor pull secret
        run: |
          kubectl create namespace ${{ env.K8S_NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

          kubectl create secret docker-registry harbor-pull-secret \
            --docker-server=${{ env.HARBOR_REGISTRY }} \
            --docker-username=${{ env.HARBOR_USER }} \
            --docker-password=${{ env.HARBOR_PASSWORD }} \
            --namespace ${{ env.K8S_NAMESPACE }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply K8s manifests
        run: |
          sed \
            -e "s|HARBOR_REGISTRY|${{ env.HARBOR_REGISTRY }}|g" \
            -e "s|namespace: dino-run|namespace: ${{ env.K8S_NAMESPACE }}|g" \
            -e "s|name: dino-run|name: ${{ env.K8S_NAMESPACE }}|g" \
            k8s/all-in-one.yaml | kubectl apply -f -

      - name: Update image tags
        run: |
          TAG=${{ needs.build-and-push.outputs.image-tag }}

          kubectl set image deployment/dino-frontend \
            dino-frontend=${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/frontend:${TAG} \
            --namespace ${{ env.K8S_NAMESPACE }}

          kubectl set image deployment/dino-backend \
            dino-backend=${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/backend:${TAG} \
            --namespace ${{ env.K8S_NAMESPACE }}

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/dino-frontend --namespace ${{ env.K8S_NAMESPACE }} --timeout=300s
          kubectl rollout status deployment/dino-backend  --namespace ${{ env.K8S_NAMESPACE }} --timeout=300s

      - name: Smoke test
        run: |
          INGRESS=$(kubectl get ingress dino-ingress \
            --namespace ${{ env.K8S_NAMESPACE }} \
            -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')

          echo "Endpoint: $INGRESS"

          for i in $(seq 1 10); do
            if curl -sf --max-time 5 "http://${INGRESS}/actuator/health" \
               | grep -q '"status":"UP"'; then
              echo "Health check passed"; break
            fi
            sleep 3
          done

      - name: Summary
        if: always()
        run: |
          echo "## Deploy Result" >> $GITHUB_STEP_SUMMARY
          echo "| 항목 | 값 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | \`${{ needs.build-and-push.outputs.image-tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Cluster | \`${{ env.EKS_CLUSTER }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Namespace | \`${{ env.K8S_NAMESPACE }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          kubectl get pods --namespace ${{ env.K8S_NAMESPACE }} >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY