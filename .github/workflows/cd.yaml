name: CD — Harbor push & EKS deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  HARBOR_REGISTRY: ${{ secrets.HARBOR_REGISTRY }}
  HARBOR_PROJECT:  sk014
  AWS_REGION:      ${{ secrets.AWS_REGION }}
  EKS_CLUSTER:     ${{ secrets.EKS_CLUSTER_NAME }}
  K8S_NAMESPACE:   ${{ secrets.K8S_NAMESPACE }}    # 배포 대상 네임스페이스 (예: devops)

jobs:
  # ── JOB 1: 빌드 & Harbor 푸시 ─────────────────────────────────
  build-and-push:
    name: Build & push to Harbor
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.tag.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Set image tag (git short SHA)
        id: tag
        run: echo "tag=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - uses: actions/setup-java@v4
        with: { java-version: '21', distribution: 'temurin', cache: gradle }

      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm', cache-dependency-path: frontend/package-lock.json }

      - name: Build Vue
        working-directory: frontend
        run: npm ci && npm run build

      - name: Build Spring Boot
        working-directory: backend
        run: ./gradlew bootJar --no-daemon -x test

      - name: Log in to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USER }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - uses: docker/setup-buildx-action@v3

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: frontend
          push: true
          tags: |
            ${{ secrets.HARBOR_REGISTRY }}/${{ secrets.HARBOR_PROJECT }}frontend:${{ steps.tag.outputs.tag }}
            ${{ secrets.HARBOR_REGISTRY }}/${{ secrets.HARBOR_PROJECT }}frontend:latest
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: backend
          push: true
          tags: |
            ${{ secrets.HARBOR_REGISTRY }}/${{ secrets.HARBOR_PROJECT }}backend:${{ steps.tag.outputs.tag }}
            ${{ secrets.HARBOR_REGISTRY }}/${{ secrets.HARBOR_PROJECT }}backend:latest
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  # ── JOB 2: EKS 배포 ───────────────────────────────────────────
  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.EKS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.EKS_SECRET_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name ${{ secrets.EKS_CLUSTER }} \
            --region ${{ secrets.AWS_REGION }}

      - name: Create namespace & Harbor pull secret
        run: |
          kubectl create namespace ${{ secrets.K8S_NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

          kubectl create secret docker-registry harbor-pull-secret \
            --docker-server=${{ secrets.HARBOR_REGISTRY }} \
            --docker-username=${{ secrets.HARBOR_USER }} \
            --docker-password=${{ secrets.HARBOR_PASSWORD }} \
            --namespace ${{ secrets.K8S_NAMESPACE }} \
            --dry-run=client -o yaml | kubectl apply -f -

      # HARBOR_REGISTRY, 네임스페이스 플레이스홀더를 실제 값으로 치환 후 적용
      - name: Apply K8s manifests
        run: |
          sed \
            -e "s|HARBOR_REGISTRY|${{ secrets.HARBOR_REGISTRY }}|g" \
            -e "s|namespace: dino-run|namespace: ${{ secrets.K8S_NAMESPACE }}|g" \
            -e "s|name: dino-run|name: ${{ secrets.K8S_NAMESPACE }}|g" \
            k8s/all-in-one.yaml | kubectl apply -f -

      # 이미지 태그 교체 → Rolling Update 시작
      - name: Update image tags
        run: |
          TAG=${{ needs.build-and-push.outputs.image-tag }}

          kubectl set image deployment/dino-frontend \
            dino-frontend=${{ secrets.HARBOR_REGISTRY }}/${{ secrets.HARBOR_PROJECT }}/frontend:${TAG} \
            --namespace ${{ secrets.K8S_NAMESPACE }}

          kubectl set image deployment/dino-backend \
            dino-backend=${{ secrets.HARBOR_REGISTRY }}/${{ secrets.HARBOR_PROJECT }}/backend:${TAG} \
            --namespace ${{ secrets.K8S_NAMESPACE }}

      # 롤아웃 완료 대기
      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/dino-frontend --namespace ${{ secrets.K8S_NAMESPACE }} --timeout=300s
          kubectl rollout status deployment/dino-backend  --namespace ${{ secrets.K8S_NAMESPACE }} --timeout=300s

      # Smoke test
      - name: Smoke test
        run: |
          INGRESS=$(kubectl get ingress dino-ingress \
            --namespace ${{ secrets.K8S_NAMESPACE }} \
            -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')

          echo "Endpoint: $INGRESS"

          for i in $(seq 1 10); do
            if curl -sf --max-time 5 "http://${INGRESS}/actuator/health" \
               | grep -q '"status":"UP"'; then
              echo "Health check passed"; break
            fi
            sleep 3
          done

      # 배포 결과 요약
      - name: Summary
        if: always()
        run: |
          echo "## Deploy Result" >> $GITHUB_STEP_SUMMARY
          echo "| 항목 | 값 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | \`${{ needs.build-and-push.outputs.image-tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Cluster | \`${{ secrets.EKS_CLUSTER }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Namespace | \`${{ secrets.K8S_NAMESPACE }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          kubectl get pods --namespace ${{ secrets.K8S_NAMESPACE }} >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY