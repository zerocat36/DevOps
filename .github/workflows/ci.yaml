name: CI — Build & Test

on:
  pull_request:
    branches: [main]
  push:
    branches: ['feature/**', 'fix/**']

jobs:
  frontend:
    name: Frontend build & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm', cache-dependency-path: frontend/package-lock.json }
      - name: Install & lint & build
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 3

  backend:
    name: Backend build & test
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.2-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '21', distribution: 'temurin', cache: gradle }
      - name: Test & build
        working-directory: backend
        run: |
          chmod +x gradlew
          ./gradlew test bootJar --no-daemon
        env:
          REDIS_LEADER_HOST: localhost
          REDIS_FOLLOWER_HOST: localhost
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: backend/build/reports/tests/test/
          retention-days: 7

  docker-check:
    name: Dockerfile build check
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: frontend-dist, path: frontend/dist/ }
      - uses: docker/setup-buildx-action@v3
      - name: Check frontend Dockerfile
        uses: docker/build-push-action@v5
        with: { context: frontend, push: false, tags: dino-run/frontend:ci }
      - name: Check backend Dockerfile
        uses: docker/build-push-action@v5
        with: { context: backend, push: false, tags: dino-run/backend:ci }